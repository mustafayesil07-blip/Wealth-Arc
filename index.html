<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7">
<title>Wealth Arc</title>
<meta name="description" content="Your wealth, at a glance. A private monthly view of total net worth, growth and goals.">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wealth Arc">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="stylesheet" href="styles.css">

<script>
/* Resolve the stored theme before first paint so there is no flash. */
(function () {
  try {
    var raw = localStorage.getItem('wealtharc_v5')
    var mode = raw ? (JSON.parse(raw).theme || 'system') : 'system'
    if (mode === 'system') {
      mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }
    document.documentElement.dataset.theme = mode
    var meta = document.querySelector('meta[name="theme-color"]')
    if (meta) meta.setAttribute('content', mode === 'dark' ? '#000000' : '#f5f5f7')
  } catch (e) { /* first run, or storage blocked */ }
})()
</script>
</head>
<body>

<a class="sr-only" href="#view">Skip to content</a>

<div class="app">
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" role="main" tabindex="-1"></main>
  </div>
</div>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="store.js"></script>
<script src="charts.js"></script>
<script src="views.js"></script>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
